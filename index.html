<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e2a63" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Operations Portal. Secure access for authorized users." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Operations" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Operations Portal</title>
    <style>
      /* First paint, before the app code loads: the neutral loading screen the app shows before sign-in (src/ui/brand.tsx). */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 9.5rem;
        background: #fff; font-family: "Montserrat Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .boot img { width: 64px; height: 64px; margin-bottom: 16px; }
      .boot b { font-size: 22px; font-weight: 700; color: #0e2a63; line-height: 1.2; }
      .boot i { margin-top: 40px; width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #173f8a; border-radius: 50%; animation: boot-spin 0.9s linear infinite; }
      .boot p { margin: 16px 0 0; font: 14px ui-sans-serif, system-ui, -apple-system, sans-serif; color: #64748b; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status"><img src="/icon.svg" alt="" /><b>Operations Portal</b><i></i><p>Loading…</p></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
